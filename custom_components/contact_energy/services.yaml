import_historical_data:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: contact_energy
    days:
      required: false
      default: 90
      example: 90
      selector:
        number:
          min: 1
          max: 1095
          mode: box
    clear_existing:
      required: false
      default: false
      selector:
        boolean:
    confirm_clear:
      required: false
      example: "yes"
      selector:
        text:

export_historical_data:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: contact_energy
    days:
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 1095
          mode: box
